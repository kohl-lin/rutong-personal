<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shopee Internal Report</title>
  <style>
    :root {
      --orange: #ee4d2d;
      --orange-soft: #fff1ec;
      --orange-hot: #f65800;
      --orange-light: #f37b62;
      --ink: #202325;
      --black: #101010;
      --muted: #757575;
      --line: #eeeff2;
      --surface: #f9f9f9;
      --white: #ffffff;
      --green: #4caf50;
      --green-bright: #70ad47;
      --red: #d0011b;
      --red-bright: #e4380e;
      --yellow: #ffbb00;
      --yellow-bright: #ffbc1b;
      --blue: #0053de;
      --blue-bright: #2794fb;
      --light-blue: #2673dd;
      --navy: #113366;
      --navy-deep: #111340;
      --cyan: #26aa99;
      --teal: #3ce6ca;
      --logo: url("./assets/brand/logos/shopee-logomark-no-text-square.png");
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #e9ebef;
      color: var(--ink);
      font-family: "Roboto", "Noto Sans SC", Arial, sans-serif;
    }

    .deck {
      width: 100vw;
      height: 100vh;
      display: grid;
      place-items: center;
    }

    .slide {
      width: min(1280px, 100vw);
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      padding: 34px 36px 36px;
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 20px 70px rgba(32, 35, 37, .12);
    }

    .slide::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 9px;
      background: linear-gradient(90deg, var(--orange) 0 34%, var(--orange-light) 34% 46%, var(--yellow) 46% 50%, var(--cyan) 50% 56%, #f7e2dc 56% 100%);
    }

    /* Prevent any display:flex/grid on a slide subclass from overriding hidden */
    .slide[hidden] { display: none !important; }

    .content-header {
      display: grid;
      grid-template-columns: 50px 1fr;
      gap: 14px;
      align-items: start;
      min-height: 54px;
    }

    .mark {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: block;
    }

    .kicker {
      margin: 0;
      color: var(--orange);
      font-family: "Shopee2021 Bold", "ShopeeFont", "Noto Sans SC", "Roboto", Arial, sans-serif;
      font-size: 17px;
      font-weight: 900;
      line-height: 1.1;
    }

    h1,
    h2,
    h3 {
      font-family: "Shopee2021 Bold", "ShopeeFont", "Noto Sans SC", "Roboto", Arial, sans-serif;
      font-weight: 900;
      letter-spacing: -.03em;
    }

    h1 {
      margin: 18px 0 0;
      max-width: 850px;
      font-size: 66px;
      line-height: .98;
    }

    h2 {
      margin: 4px 0 0;
      max-width: 1120px;
      font-size: 20px;
      line-height: 1.25;
    }

    h3 {
      margin: 0 0 8px;
      color: var(--orange);
      font-size: 18px;
      line-height: 1.1;
    }

    .title-rule {
      height: 5px;
      margin: 2px 0 14px;
      background: linear-gradient(90deg, var(--orange) 0 calc(100% - 20px), transparent calc(100% - 20px));
      position: relative;
    }

    .title-rule::after {
      content: "";
      position: absolute;
      right: 0;
      top: -5px;
      width: 15px;
      height: 15px;
      border-radius: 999px;
      background: var(--orange);
    }

    .subtitle {
      margin: 16px 0 0;
      max-width: 760px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.36;
      font-weight: 700;
    }

    .footer {
      position: absolute;
      left: 36px;
      right: 36px;
      bottom: 18px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .cover {
      padding: 72px;
    }

    .cover::before {
      height: 0;
    }

    .cover .mark {
      width: 64px;
      height: 64px;
    }

    .cover-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 120px;
      background: var(--orange);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 44px;
    }

    .cover-bar-left,
    .cover-bar-right {
      color: var(--white);
      font-size: 13px;
      font-weight: 800;
    }

    .cover .footer {
      left: 44px;
      right: 44px;
      bottom: 18px;
      color: rgba(255, 255, 255, .96);
      z-index: 1;
    }

    .cover-meta {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 44px;
      max-width: 940px;
    }

    .meta-card,
    .card,
    .note,
    .panel {
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
    }

    .meta-card b,
    .card b,
    .note b {
      display: block;
      color: var(--orange);
      font-size: 12px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    .meta-card span,
    .card span,
    .note span {
      display: block;
      font-size: 14px;
      line-height: 1.28;
      font-weight: 800;
    }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .content { margin-top: 4px; }

    .summary-card {
      min-height: 154px;
      border-top: 5px solid var(--orange);
    }

    .summary-card p,
    .panel p,
    .note p {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.35;
      font-weight: 700;
    }

    .framework {
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 14px;
    }

    .flow {
      display: grid;
      gap: 10px;
    }

    .flow-step {
      display: grid;
      grid-template-columns: 44px 1fr;
      gap: 12px;
      align-items: start;
      padding: 12px;
      border: 1px solid rgba(238, 77, 45, .22);
      border-radius: 14px;
      background: var(--orange-soft);
    }

    .badge {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      color: var(--white);
      background: var(--orange);
      font-weight: 900;
    }

    .kpi-card {
      min-height: 120px;
      padding: 12px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: inset 0 5px 0 var(--orange);
    }

    .kpi-card:nth-child(2) { box-shadow: inset 0 5px 0 var(--blue); }
    .kpi-card:nth-child(3) { box-shadow: inset 0 5px 0 var(--yellow); }
    .kpi-card:nth-child(4) { box-shadow: inset 0 5px 0 #26aa99; }

    .kpi-value {
      margin: 6px 0;
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .kpi-label,
    .kpi-note {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
    }

    .table-wrap {
      overflow: hidden;
      border: 2px solid #111;
      background: var(--white);
      align-self: start;
    }

    .table-wrap[data-auto-fit-table] {
      justify-self: stretch;
    }

    [data-auto-fit-table] {
      --table-scale: 1;
      --table-scale-y: 1;
    }

    [data-auto-fit-table] table {
      --dense-table-font: 10.5px;
      --dense-table-pad-y: 5px;
      --dense-table-pad-x: 6px;
    }

    [data-auto-fit-table].is-wide table {
      --dense-table-font: 9.4px;
      --dense-table-pad-y: 4px;
      --dense-table-pad-x: 4px;
    }

    [data-auto-fit-table].is-very-wide table,
    [data-auto-fit-table].is-tall table {
      --dense-table-font: 8.6px;
      --dense-table-pad-y: 3px;
      --dense-table-pad-x: 3px;
    }

    [data-auto-fit-table].is-ultra-dense table {
      --dense-table-font: 8px;
      --dense-table-pad-y: 2px;
      --dense-table-pad-x: 2px;
    }

    [data-fill-slide-block] {
      height: var(--fill-block-height, auto);
      min-height: 0;
    }

    [data-stretch-table] {
      min-height: 0;
      overflow: hidden;
      display: flex;
      align-items: stretch;
    }

    [data-stretch-table] table {
      width: 100%;
      height: 100%;
    }

    .table-frame-note {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 8px;
      align-items: start;
      padding: 8px 10px;
      border-top: 2px solid #111;
      background: #f7f7f7;
      font-size: 10.5px;
      line-height: 1.24;
      font-weight: 800;
    }

    .table-frame-note b {
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    th,
    td {
      padding: calc(var(--dense-table-pad-y, 5px) * var(--table-scale-y, 1)) calc(var(--dense-table-pad-x, 6px) * var(--table-scale, 1));
      border: 1px solid #fff;
      font-size: calc(var(--dense-table-font, 10.5px) * var(--table-scale, 1));
      line-height: 1.15;
      text-align: center;
      vertical-align: middle;
    }

    th {
      color: var(--white);
      background: #000;
      font-weight: 900;
    }

    td:first-child,
    .left {
      text-align: left;
      font-weight: 900;
    }

    .group td,
    td.group {
      background: #efefef;
      font-weight: 900;
    }

    .soft-green { background: #d9ead3; }
    .soft-red { background: #ead1d1; }
    .soft-amber { background: #fce5cd; }
    .positive { color: #274e13; font-weight: 900; }
    .negative { color: #a61c14; font-weight: 900; }
    .status-good { color: #fff; background: var(--green); font-weight: 900; }
    .status-bad { color: #fff; background: #b51d16; font-weight: 900; }
    .status-watch { color: #000; background: #ffd966; font-weight: 900; }

    .matrix-layout {
      display: grid;
      grid-template-columns: 212px 1fr;
      gap: 10px;
      align-items: start;
    }

    .side-rail {
      display: grid;
      align-content: stretch;
      background: #efefef;
      min-height: 0;
    }

    .side-rail .rail-copy {
      padding: 14px;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.22;
    }

    .rail-stage {
      display: grid;
      place-items: center;
      padding: 14px 10px;
      color: var(--orange);
      font-size: 16px;
      font-weight: 900;
      text-align: center;
      border-top: 8px solid #fff;
    }

    .decision {
      align-self: end;
      padding: 12px;
      color: #a61c14;
      background: #f4cccc;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.2;
    }

    .mechanism {
      display: grid;
      grid-template-columns: .8fr 1.1fr 1.1fr;
      margin-top: 12px;
    }

    .mechanism > div {
      padding: 12px 16px;
      border-bottom: 3px solid #111;
      font-size: 14.5px;
      line-height: 1.22;
    }

    .mechanism .head {
      color: var(--white);
      background: #000;
      font-size: 17px;
      font-weight: 900;
      text-align: center;
    }

    .mechanism .head:first-child { background: #b21d16; }
    .mechanism .head:last-of-type { background: #ef2f25; }

    .timeline {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 4px;
    }

    .phase {
      min-height: 260px;
      padding: 16px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
      border-top: 6px solid var(--orange);
    }

    .phase ul,
    .mechanism ul {
      margin: 8px 0 0;
      padding-left: 18px;
    }

    .phase li,
    .mechanism li {
      margin-bottom: 5px;
      font-weight: 700;
    }

    [contenteditable="true"] {
      outline: 0;
      border-radius: 4px;
      transition: box-shadow .16s ease, background .16s ease;
      cursor: text;
    }

    [contenteditable="true"]:hover {
      background: rgba(238, 77, 45, .06);
      box-shadow: 0 0 0 2px rgba(238, 77, 45, .10);
    }

    [contenteditable="true"]:focus {
      background: #fff7f4;
      box-shadow: 0 0 0 2px rgba(238, 77, 45, .34);
    }

    [data-deck-toolbar] {
      /* In normal flow BELOW the 1280x720 canvas — never a fixed overlay that
         covers slide content (matches the toolbar rule in the skill docs). */
      position: static;
      width: max-content;
      margin: 14px auto 20px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid rgba(32, 35, 37, .16);
      border-radius: 999px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 10px 30px rgba(32, 35, 37, .14);
      font-size: 12px;
      font-weight: 800;
    }

    [data-deck-toolbar] button {
      border: 0;
      border-radius: 999px;
      padding: 7px 10px;
      color: #fff;
      background: var(--orange);
      font: inherit;
      cursor: pointer;
    }

    [data-edit-status] {
      color: var(--muted);
      padding: 0 4px;
    }

    /* ── Agenda ── */
    .agenda-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 24px;
    }

    .agenda-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.2;
      cursor: pointer;
      transition: background .14s, border-color .14s;
      user-select: none;
    }

    .agenda-item:hover { background: var(--orange-soft); border-color: var(--orange); }

    .agenda-num {
      flex-shrink: 0;
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--orange);
      color: #fff;
      font-size: 12px;
      font-weight: 900;
    }

    /* ── Tabs ── */
    .tab-nav { display: flex; gap: 4px; margin-bottom: 10px; }

    .tab-btn {
      padding: 6px 14px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      font-family: "Shopee2021 Bold", "ShopeeFont", "Noto Sans SC", "Roboto", Arial, sans-serif;
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
      transition: background .12s, border-color .12s, color .12s;
    }

    .tab-btn.active { background: var(--orange); border-color: var(--orange); color: #fff; }
    .tab-btn:hover:not(.active) { background: var(--orange-soft); border-color: var(--orange); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Status chip (inline) ── */
    .chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 900;
    }

    /* ── Footer — compliance note + modal trigger ── */
    .compliance-note {
      font-style: italic;
      font-weight: 600;
      font-size: 10.5px;
      color: var(--muted);
      max-width: 640px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .footer-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .modal-trigger {
      padding: 2px 8px;
      border: 1.5px solid var(--orange);
      border-radius: 6px;
      background: transparent;
      color: var(--orange);
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
      line-height: 1.4;
      font-family: inherit;
      flex-shrink: 0;
      transition: background .12s, color .12s;
    }

    .modal-trigger:hover { background: var(--orange); color: #fff; }

    /* ── Modal overlay ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(32, 35, 37, .55);
      backdrop-filter: blur(4px);
    }

    .modal-overlay[hidden] { display: none; }

    .modal-box {
      position: relative;
      width: min(520px, 90vw);
      max-height: 80vh;
      overflow-y: auto;
      background: var(--white);
      border-radius: 16px;
      padding: 28px 28px 24px;
      box-shadow: 0 24px 60px rgba(32, 35, 37, .24);
    }
    .modal-box.wide {
      width: min(1100px, 94vw);
    }
    .zoom-table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      padding: 8px;
      margin-top: 10px;
    }
    .zoom-table-wrap table {
      min-width: 980px;
    }

    .modal-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      display: grid;
      place-items: center;
      line-height: 1;
    }

    .modal-body { font-size: 13px; line-height: 1.6; font-weight: 700; color: var(--ink); }
    .modal-body strong { color: var(--orange); display: block; margin-bottom: 8px; font-size: 14px; }
    .modal-body p { margin: 0 0 6px; }

    /* ── Ending slide ── */
    .ending {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .ending .mark { width: 72px; height: 72px; }

    .ending-title {
      color: var(--orange);
      font-family: "Shopee2021 Bold", "ShopeeFont", "Noto Sans SC", "Roboto", Arial, sans-serif;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: -.04em;
      text-align: center;
      margin: 0;
    }

    .ending-sub {
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      margin: 0;
    }

    .ending-contact { display: flex; gap: 32px; }

    .ending-contact-item { text-align: center; }
    .ending-contact-item b { display: block; color: var(--orange); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
    .ending-contact-item span { color: var(--ink); font-size: 13px; font-weight: 700; }

    /* ── Split Layout (图文互证 / 现状对比) ── */
    .split-layout { display: grid; grid-template-columns: 46% 54%; gap: 18px; align-items: center; }
    .split-left { display: flex; flex-direction: column; justify-content: center; gap: 10px; }
    .key-points { margin: 0; padding-left: 20px; }
    .key-points li { margin-bottom: 10px; font-size: 14px; line-height: 1.4; font-weight: 700; }
    .key-points li::marker { color: var(--orange); }
    .split-right { display: flex; align-items: stretch; }
    .image-box {
      width: 100%; min-height: 280px;
      border-radius: 14px; border: 2px dashed var(--line);
      background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 13px; font-weight: 700;
      text-align: center; padding: 20px; line-height: 1.6;
    }

    /* -- Left / Right Overview (program background + objective) -- */
    .lr-overview {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: stretch;
      min-height: 0;
    }
    .overview-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 20px rgba(32, 35, 37, .04);
    }
    .overview-panel-title {
      padding: 12px 18px;
      color: #fff;
      background: linear-gradient(90deg, var(--orange) 0%, #df634e 100%);
      font-size: 17px;
      font-weight: 900;
      text-align: center;
      letter-spacing: -.01em;
    }
    .overview-panel-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1 1 auto;
      padding: 16px 18px 18px;
    }
    .overview-message {
      padding: 14px 16px;
      background: #f3f3f3;
      border: 1px solid #ececec;
      color: var(--ink);
      font-size: 18px;
      font-weight: 900;
      line-height: 1.28;
      text-align: center;
    }
    .overview-message strong { color: var(--orange); }
    .mini-chart-title,
    .overview-subtitle {
      color: var(--ink);
      font-size: 14px;
      font-style: italic;
      font-weight: 700;
    }
    .mini-bar-chart {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      align-items: end;
      min-height: 174px;
      padding: 14px 8px 0;
      border-bottom: 2px solid #333;
    }
    .mini-bar {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      min-width: 0;
      height: 100%;
      gap: 5px;
    }
    .mini-bar-value {
      color: var(--orange);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }
    .mini-bar-fill {
      width: 70%;
      min-height: 34px;
      border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg, #f6a15f 0%, #e58a42 100%);
    }
    .mini-bar-label {
      color: var(--ink);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }
    .overview-objective-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      align-items: center;
      flex: 1 1 auto;
    }
    .overview-checks {
      display: grid;
      gap: 14px;
    }
    .overview-check {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      align-items: start;
    }
    .check-dot {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: #4d9a6a;
      color: #fff;
      font-size: 20px;
      font-weight: 900;
      line-height: 1;
    }
    .overview-check p {
      margin: 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 900;
      line-height: 1.25;
    }
    .category-stack {
      display: grid;
      gap: 10px;
      position: relative;
    }
    .category-stack::before {
      content: "";
      position: absolute;
      left: -28px;
      top: 50%;
      width: 0;
      height: 0;
      border-top: 52px solid transparent;
      border-bottom: 52px solid transparent;
      border-left: 20px solid var(--orange);
      opacity: .72;
      transform: translateY(-50%);
    }
    .category-pill {
      padding: 13px 18px;
      background: #f7e4cf;
      color: var(--ink);
      font-size: 17px;
      font-weight: 900;
      text-align: center;
    }

    /* -- Four-step Logic Progression -- */
    .logic-progression {
      display: grid;
      grid-template-columns: 1fr 26px 1fr 26px 1fr 26px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 300px;
    }
    .logic-card {
      min-height: 236px;
      padding: 16px 16px 14px;
      border: 1.5px solid var(--line);
      border-top: 6px solid var(--orange);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(32, 35, 37, .05);
    }
    .logic-card:nth-of-type(3) { border-top-color: var(--blue); }
    .logic-card:nth-of-type(5) { border-top-color: var(--cyan); }
    .logic-card:nth-of-type(7) { border-top-color: var(--yellow); }
    .logic-step {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
      color: var(--orange);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .logic-step-number {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 8px;
      color: #fff;
      background: var(--orange);
      font-size: 11px;
    }
    .logic-card h3 {
      margin-bottom: 10px;
      color: var(--ink);
      font-size: 18px;
      line-height: 1.16;
      letter-spacing: -.02em;
    }
    .logic-card p {
      margin: 0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.42;
    }
    .logic-evidence {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 8px;
      background: var(--orange-soft);
      color: #9f3c25;
      font-size: 11.5px;
      font-weight: 900;
      line-height: 1.3;
    }
    .logic-arrow {
      color: var(--orange);
      font-size: 28px;
      font-weight: 900;
      text-align: center;
    }
    .logic-answer-bar {
      display: grid;
      grid-template-columns: 138px 1fr;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
      padding: 12px 15px;
      border: 1.5px solid rgba(238, 77, 45, .28);
      border-radius: 12px;
      background: linear-gradient(90deg, #fff1ec 0%, #fff 100%);
    }
    .logic-answer-label {
      color: var(--orange);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .logic-answer-text {
      margin: 0;
      color: var(--ink);
      font-size: 14px;
      font-weight: 900;
      line-height: 1.34;
    }

    /* ── Accordion (痛点与解法) ── */
    .accordion { display: flex; flex-direction: column; gap: 5px; }
    .acc-item { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .acc-trigger {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
      padding: 10px 14px; background: var(--surface); border: 0;
      font-family: inherit; font-size: 13.5px; font-weight: 900;
      cursor: pointer; text-align: left; gap: 8px;
      transition: background .12s, color .12s;
    }
    .acc-trigger:hover { background: var(--orange-soft); }
    .acc-item.open .acc-trigger { background: var(--orange); color: #fff; }
    .acc-icon { flex-shrink: 0; font-style: normal; transition: transform .18s; }
    .acc-item.open .acc-icon { transform: rotate(90deg); }
    .acc-panel { display: none; padding: 11px 14px; font-size: 13px; line-height: 1.4; font-weight: 700; border-top: 1px solid var(--line); background: #fff; }
    .acc-item.open .acc-panel { display: block; }
    .pain-label { display: block; color: var(--orange); font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }

    /* ── Cross-team Coordination Matrix ── */
    .coord-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .coord-card { border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
    .coord-tag { padding: 7px 12px; background: var(--ink); color: #fff; font-size: 11px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; }
    .coord-section { padding: 10px 12px; flex: 1; }
    .coord-section + .coord-section { border-top: 1px solid var(--line); }
    .coord-section b { display: block; color: var(--orange); font-size: 10.5px; font-weight: 900; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .coord-section p { margin: 0; font-size: 12.5px; line-height: 1.35; font-weight: 700; }

    /* ── Data + Key Highlights ──────────────────────────────────────
       [适用场景] 数据异动分析 / 广告绩效复盘 / 跨市场 KPI 对比
       规则: 表格占 63%，关键结论占 37%；表格行按维度分组
    ─────────────────────────────────────────────────────────────── */
    .data-highlights { display: grid; grid-template-columns: 63% 37%; gap: 14px; align-items: start; }
    .data-highlights[data-fill-slide-block] { align-items: stretch; }

    .row-group td { background: #2b2b2b !important; color: #fff !important; font-weight: 900; text-align: left !important; font-size: 10.5px; }

    .kh-panel { display: flex; flex-direction: column; }
    .data-highlights[data-fill-slide-block] .kh-panel { height: 100%; justify-content: space-between; }
    .kh-label { font-size: 10.5px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 8px; }
    .kh-item { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; margin-bottom: 10px; }
    .data-highlights[data-fill-slide-block] .kh-item { margin-bottom: 0; padding: 8px 0; border-top: 1px solid var(--line); }
    .data-highlights[data-fill-slide-block] .kh-item:first-of-type { border-top: none; padding-top: 0; }
    .kh-num { width: 22px; height: 22px; border-radius: 50%; background: var(--orange); color: #fff; font-size: 11px; font-weight: 900; display: grid; place-items: center; flex-shrink: 0; margin-top: 1px; }
    .kh-text { font-size: 12.5px; line-height: 1.4; font-weight: 700; }
    .kh-sub { margin: 4px 0 0; padding-left: 14px; }
    .kh-sub li { font-size: 11.5px; line-height: 1.3; font-weight: 600; margin-bottom: 3px; }

    /* ── Context + Decision Split ────────────────────────────────────
       [适用场景] 决策申请 / 风险升级 / Approval Request / 方案对比
       规则: 顶部灰底 Context Box 说明背景 → 下方左黑右橙双栏决策
    ─────────────────────────────────────────────────────────────── */
    .context-box { background: #efefef; border-radius: 8px; padding: 9px 14px; margin-bottom: 10px; }
    .context-box ul { margin: 3px 0 0; padding-left: 18px; }
    .context-box > ul > li { font-size: 12.5px; line-height: 1.4; font-weight: 700; margin-bottom: 3px; }
    .context-box ul ul { margin-top: 2px; }
    .context-box ul ul li { font-size: 11.5px; font-weight: 600; color: #444; margin-bottom: 2px; }
    .approval-tag { color: #c0392b; font-weight: 900; }

    .decision-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .decision-panel { border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
    .panel-head { text-align: center; padding: 7px 12px; font-size: 13px; font-weight: 900; }
    .panel-head-dark { background: #111; color: #fff; }
    .panel-head-orange { background: var(--orange); color: #fff; }
    .panel-body { padding: 11px 13px; }
    .panel-body p { margin: 0 0 5px; font-size: 12.5px; line-height: 1.4; font-weight: 700; }
    .panel-body p.fine { font-size: 11px; color: var(--muted); font-weight: 600; }
    .panel-body ul { margin: 4px 0 0; padding-left: 17px; }
    .panel-body li { font-size: 12px; line-height: 1.35; font-weight: 700; margin-bottom: 4px; }
    .proposal-box { border: 2px solid var(--orange); border-radius: 6px; padding: 9px 11px; }
    .proposal-label { color: var(--orange); font-weight: 900; text-decoration: underline; }
    .see-next-tag { background: var(--orange); color: #fff; font-size: 10.5px; font-weight: 900; font-style: italic; padding: 3px 10px; border-radius: 0 6px 6px 6px; display: inline-block; margin-top: 6px; }
    .explore-note { margin-top: 9px; font-size: 12px; line-height: 1.4; font-weight: 700; }
    .explore-label { color: var(--orange); font-weight: 900; text-decoration: underline; }

    /* ── WoW Trend Analysis ──────────────────────────────────────────
       [适用场景] 周度趋势复盘 / 核心指标走势监控 / Campaign 前后对比
       规则: 5–6 周趋势表 + WoW Δ 徽章 + 右侧关注点 Panel
    ─────────────────────────────────────────────────────────────── */
    .trend-grid { display: grid; grid-template-columns: 67% 33%; gap: 14px; align-items: start; }
    .trend-grid[data-fill-slide-block] { align-items: stretch; }
    .delta-badge { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 11px; font-weight: 900; white-space: nowrap; }
    .delta-badge.up   { background: #e6f7f5; color: var(--cyan); }
    .delta-badge.down { background: #fce8ec; color: var(--red); }
    .delta-badge.warn { background: #fff3cc; color: #b8860b; }
    .delta-badge.flat { background: #f0f0f0; color: var(--muted); }
    .delta-badge.good-down { background: #e6f7f5; color: var(--cyan); }
    .watch-panel { display: flex; flex-direction: column; gap: 8px; }
    .trend-grid[data-fill-slide-block] .watch-panel { height: 100%; }
    .watch-block { padding: 9px 11px; border-radius: 6px; border-left: 3px solid; }
    .trend-grid[data-fill-slide-block] .watch-block { flex: 1 1 0; }
    .watch-block.positive { border-color: var(--cyan); background: #f0faf9; }
    .watch-block.negative { border-color: var(--red); background: #fef5f7; }
    .watch-block.neutral  { border-color: var(--navy); background: #f0f2f8; }
    .watch-title { font-size: 10.5px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .watch-block.positive .watch-title { color: var(--cyan); }
    .watch-block.negative .watch-title { color: var(--red); }
    .watch-block.neutral  .watch-title { color: var(--navy); }
    .watch-body { font-size: 12px; line-height: 1.4; font-weight: 700; margin: 0; }
    .watch-sub  { font-size: 11px; color: var(--muted); font-weight: 600; margin: 3px 0 0; }

    /* ── Funnel Analysis ──────────────────────────────────────────────
       [适用场景] 转化漏斗 / 用户路径诊断 / 环节转化率优化
       规则: 每行一漏斗阶段，条形 = 占首阶 UV 比例；右侧 KPI 卡片
    ─────────────────────────────────────────────────────────────── */
    .funnel-layout { display: grid; grid-template-columns: 60% 40%; gap: 18px; align-items: start; }
    .funnel-rows { display: flex; flex-direction: column; }
    .funnel-stage { display: grid; grid-template-columns: 155px 1fr 110px 70px; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
    .funnel-rows .funnel-stage:first-child { border-top: none; }
    .funnel-stage-name { font-size: 12px; font-weight: 900; }
    .funnel-bar-track { background: #f0f0f0; border-radius: 4px; height: 14px; overflow: hidden; }
    .funnel-bar-fill { height: 100%; border-radius: 4px; }
    .f-col1 { background: var(--navy); } .f-col2 { background: var(--blue); }
    .f-col3 { background: var(--light-blue); } .f-col4 { background: var(--cyan); }
    .f-col5 { background: var(--orange); }
    .funnel-count { font-size: 12px; font-weight: 700; text-align: right; color: var(--muted); white-space: nowrap; }
    .funnel-cvr-val { font-size: 13px; font-weight: 900; text-align: right; }
    .funnel-drop-note { font-size: 10.5px; color: var(--red); font-weight: 700; padding: 1px 0 3px 163px; }
    .funnel-kpi-panel { display: flex; flex-direction: column; gap: 8px; }
    .fkpi-card { padding: 10px 12px; border-radius: 7px; background: var(--surface); border-left: 3px solid var(--orange); }
    .fkpi-label { font-size: 10.5px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
    .fkpi-value { font-size: 24px; font-weight: 900; line-height: 1; margin-bottom: 2px; }
    .fkpi-note  { font-size: 11.5px; font-weight: 600; color: var(--muted); }
    .fkpi-card.alert { border-left-color: var(--red); background: #fef5f7; }
    .fkpi-card.alert .fkpi-value { color: var(--red); }
    .fkpi-card.good  { border-left-color: var(--cyan); background: #f0faf9; }
    .fkpi-card.good  .fkpi-value { color: var(--cyan); }

    /* ── Variance Attribution (Waterfall) ─────────────────────────────
       [适用场景] 指标异动归因 / GMV 下滑根因 / 同环比分解
       规则: 顶部总 Delta → 逐项拆解正负贡献 → 右侧解读
    ─────────────────────────────────────────────────────────────── */
    .va-layout { display: grid; grid-template-columns: 60% 40%; gap: 16px; align-items: start; }
    .va-row { display: grid; grid-template-columns: 190px 72px 1fr; gap: 10px; align-items: center; padding: 5px 0; border-top: 1px solid var(--line); }
    .va-row:first-child { border-top: none; }
    .va-row.total-row  { border-top: none; border-bottom: 2px solid var(--ink); padding-bottom: 9px; margin-bottom: 3px; }
    .va-row.sub-row    { border-top: 2px dashed var(--muted); margin-top: 2px; padding-top: 8px; }
    .va-label { font-size: 12px; font-weight: 700; }
    .va-label.strong { font-weight: 900; font-size: 13px; }
    .va-val { font-size: 12.5px; font-weight: 900; text-align: right; white-space: nowrap; }
    .va-val.pos   { color: var(--cyan); }
    .va-val.neg   { color: var(--red); }
    .va-val.total { color: var(--orange); }
    .va-bar-zone { position: relative; height: 18px; }
    .va-center   { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #bbb; }
    .va-bar { position: absolute; top: 3px; height: 12px; border-radius: 2px; min-width: 2px; }
    .va-bar.pos       { left: 50%; background: var(--cyan); }
    .va-bar.neg       { right: 50%; background: var(--red); }
    .va-bar.total-pos { left: 50%; background: var(--orange); }
    .va-notes { display: flex; flex-direction: column; gap: 8px; }
    .va-note { padding: 9px 11px; border-radius: 6px; background: var(--surface); border-left: 3px solid var(--line); }
    .va-note.key  { border-left-color: var(--orange); background: var(--orange-soft); }
    .va-note.risk { border-left-color: var(--red); background: #fef5f7; }
    .va-note.good { border-left-color: var(--cyan); background: #f0faf9; }
    .va-note-tag  { font-size: 10.5px; font-weight: 900; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; color: var(--muted); }
    .va-note.key  .va-note-tag { color: var(--orange); }
    .va-note.risk .va-note-tag { color: var(--red); }
    .va-note.good .va-note-tag { color: var(--cyan); }
    .va-note-body { font-size: 12px; line-height: 1.4; font-weight: 700; margin: 0; }

    /* ── Market / Category Ranking ────────────────────────────────────
       [适用场景] 市场排名 / 品类表现对比 / 卖家层级分析 / 竞争力评估
       规则: 按核心指标降序；条形 = 相对大小；右侧分析 Panel
    ─────────────────────────────────────────────────────────────── */
    .ranking-layout { display: grid; grid-template-columns: 67% 33%; gap: 14px; align-items: start; }
    .ranking-layout[data-fill-slide-block] { align-items: stretch; }
    .ranking-table { width: 100%; border-collapse: collapse; }
    .ranking-layout[data-fill-slide-block] .ranking-table { height: 100%; }
    .ranking-table thead tr { background: var(--navy); }
    .ranking-table thead th { color: #fff; font-size: 11px; font-weight: 900; padding: 7px 9px; text-align: left; white-space: nowrap; }
    .ranking-table tbody tr { border-bottom: 1px solid var(--line); }
    .ranking-table tbody tr:last-child { border-bottom: none; }
    .ranking-table td { padding: 6px 8px; vertical-align: middle; font-size: 12px; font-weight: 700; }
    .rank-badge { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 900; }
    .rk-gold   { background: var(--yellow); color: #555; }
    .rk-silver { background: #9e9e9e; color: #fff; }
    .rk-bronze { background: #b06a2f; color: #fff; }
    .rk-other  { background: #e0e0e0; color: #666; }
    .rank-bar-track { background: #f0f0f0; border-radius: 3px; height: 10px; overflow: hidden; min-width: 50px; }
    .rank-bar-fill { height: 100%; border-radius: 3px; }
    .rb1 { background: var(--navy); }   .rb2 { background: var(--blue); }
    .rb3 { background: var(--light-blue); } .rb4 { background: var(--cyan); }
    .rb5 { background: var(--orange); } .rb6 { background: #8e9db4; } .rb7 { background: #bdc6d4; }
    .status-tag { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 10.5px; font-weight: 900; white-space: nowrap; }
    .st-on   { background: #e6f7f5; color: var(--cyan); }
    .st-watch { background: #fff3cc; color: #b8860b; }
    .st-risk  { background: #fce8ec; color: var(--red); }
    .st-opp   { background: #e8eeff; color: var(--blue); }
    .ranking-callouts { display: flex; flex-direction: column; gap: 8px; }
    .ranking-layout[data-fill-slide-block] .ranking-callouts { height: 100%; }
    .ranking-layout[data-fill-slide-block] .rc-card { flex: 1 1 0; }
    .rc-card { padding: 9px 11px; border-radius: 6px; border-left: 3px solid; }
    .rc-card.good { background: #f0faf9; border-left-color: var(--cyan); }
    .rc-card.warn { background: #fff9e6; border-left-color: var(--yellow); }
    .rc-card.risk { background: #fef5f7; border-left-color: var(--red); }
    .rc-tag  { font-size: 10.5px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .rc-card.good .rc-tag { color: var(--cyan); }
    .rc-card.warn .rc-tag { color: #b8860b; }
    .rc-card.risk .rc-tag { color: var(--red); }
    .rc-body { font-size: 12px; line-height: 1.4; font-weight: 700; }

    /* ── Period Context Bar ────────────────────────────────────────────
       Slide-top strip: current period, baseline, scope, owner
    ─────────────────────────────────────────────────────────────── */
    .period-bar { display: flex; gap: 0; align-items: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-bottom: 10px; }
    .period-bar-item { padding: 5px 14px; display: flex; flex-direction: column; gap: 1px; }
    .period-bar-item + .period-bar-item { border-left: 1px solid var(--line); }
    .period-bar-item.accent { background: var(--orange-soft); }
    .period-bar-lbl { font-size: 9.5px; font-weight: 900; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
    .period-bar-val { font-size: 13px; font-weight: 900; color: var(--ink); }
    .period-bar-item.accent .period-bar-val { color: var(--orange); }

    /* ── Section Badge ─────────────────────────────────────────────── */
    .sec-badge { display: inline-block; padding: 2px 9px; border-radius: 4px; font-size: 9.5px; font-weight: 900; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
    .sb-orange { background: var(--orange-soft); color: var(--orange); }
    .sb-navy   { background: #e8eeff; color: var(--navy); }
    .sb-cyan   { background: #e6f7f5; color: var(--cyan); }
    .sb-muted  { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
    .sb-red    { background: #fce8ec; color: var(--red); }
    .sb-yellow { background: #fff8e1; color: #b8860b; }

    /* ── Insight Box ───────────────────────────────────────────────── */
    .insight-box { border: 1.5px solid var(--orange); border-radius: 8px; padding: 10px 13px; background: var(--orange-soft); margin-top: 10px; }
    .insight-box-lbl { color: var(--orange); font-size: 10px; font-weight: 900; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 4px; }
    .insight-box-body { font-size: 12.5px; font-weight: 700; line-height: 1.4; margin: 0; }

    /* ── Callout Frame ─────────────────────────────────────────────── */
    .callout-frame { border: 1px solid var(--line); border-radius: 7px; padding: 9px 12px; background: var(--surface); }
    .callout-frame-title { font-size: 10px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
    .callout-frame p, .callout-frame li { font-size: 12px; font-weight: 700; line-height: 1.4; margin: 0 0 3px; }
    .callout-frame ul { margin: 3px 0 0; padding-left: 16px; }

    /* ── Milestone Card ────────────────────────────────────────────────
       [适用场景] 极简单指标里程碑 / 扭亏为盈 / 单一关键成就
       规则: 单个 KPI 放大至 64px+；下方三栏解读，不留空白
    ─────────────────────────────────────────────────────────────── */
    .milestone-hero { display: flex; gap: 24px; align-items: flex-end; margin-bottom: 14px; }
    .milestone-number { font-size: 72px; font-weight: 900; letter-spacing: -.04em; line-height: .9; color: var(--orange); }
    .milestone-delta { font-size: 28px; font-weight: 900; letter-spacing: -.03em; color: var(--cyan); margin-bottom: 10px; }
    .milestone-hero-meta { padding-bottom: 8px; }
    .milestone-hero-label { font-size: 12px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
    .milestone-hero-context { font-size: 14px; font-weight: 700; max-width: 480px; line-height: 1.4; }
    .milestone-action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 11px; }
    .milestone-action-card { border: 1px solid var(--line); border-radius: 8px; padding: 11px 13px; background: var(--surface); border-top: 3px solid; }
    .milestone-action-card.col-orange { border-top-color: var(--orange); }
    .milestone-action-card.col-cyan   { border-top-color: var(--cyan); }
    .milestone-action-card.col-navy   { border-top-color: var(--navy); }
    .milestone-action-num { font-size: 10.5px; font-weight: 900; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
    .col-orange .milestone-action-num { color: var(--orange); }
    .col-cyan   .milestone-action-num { color: var(--cyan); }
    .col-navy   .milestone-action-num { color: var(--navy); }
    .milestone-action-title { font-size: 13px; font-weight: 900; margin-bottom: 5px; }
    .milestone-action-body  { font-size: 11.5px; font-weight: 700; line-height: 1.4; color: var(--muted); }
    .milestone-action-items { margin: 7px 0 0; padding-left: 16px; }
    .milestone-action-items li { font-size: 11.5px; font-weight: 700; line-height: 1.35; margin-bottom: 4px; color: var(--ink); }
    .milestone-bottom-bar { display: flex; gap: 10px; margin-top: 11px; }
    .milestone-pill { flex: 1; display: flex; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
    .milestone-pill .pill-lbl { font-size: 9.5px; font-weight: 900; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; flex-shrink: 0; }
    .milestone-pill .pill-val { font-size: 12.5px; font-weight: 900; }

    /* ── Reporter tag (top-right of content slides) ─── */
    .content-header { grid-template-columns: 50px 1fr auto !important; }
    .reporter-tag { font-size: 10px; font-weight: 800; color: var(--muted); text-align: right; align-self: start; padding-top: 4px; white-space: nowrap; line-height: 1.3; min-width: 92px; }

    /* ── Annotation dot (red circle badge with number) ─── */
    .anno-dot { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 16px; padding: 0 3px; border-radius: 999px; background: var(--red); color: #fff; font-size: 9px; font-weight: 900; line-height: 1; margin-left: 3px; vertical-align: middle; flex-shrink: 0; cursor: default; }

    /* ── Cell states for topline tables ─── */
    .cell-good { background: #e6f5ea !important; }
    .cell-risk { box-shadow: inset 0 0 0 2px var(--red) !important; position: relative; }
    .cell-warn { background: #fff8e1 !important; }
    .row-metric-group { background: #202325 !important; color: #fff !important; font-size: calc(11px * var(--table-scale, 1)) !important; font-weight: 900 !important; text-align: center !important; vertical-align: middle !important; }
    .row-sub { color: var(--muted) !important; font-weight: 600 !important; font-size: calc(10px * var(--table-scale, 1)) !important; padding-left: calc(10px * var(--table-scale, 1)) !important; }

    /* ── Executive Summary upper-lower layout ─── */
    .exec-layout { display: flex; flex-direction: column; gap: 10px; min-height: 0; padding-bottom: 0; }
    .exec-table-zone { flex: 1 1 0; min-height: 210px; overflow: hidden; display: flex; align-items: stretch; border: 2px solid #111; background: var(--white); }
    .exec-commentary { flex: 0 1 auto; min-height: 132px; max-height: 52%; border: 1.5px solid var(--line); border-top: 3px solid var(--orange); border-radius: 12px; padding: 10px 14px 12px; overflow: hidden; background: linear-gradient(180deg, #f7f7f7 0%, #fff 20%); display: flex; flex-direction: column; gap: 8px; }
    .commentary-lead { font-size: 11px; font-weight: 700; line-height: 1.45; color: var(--ink); margin: 0 0 6px; border-left: 3px solid var(--orange); padding-left: 8px; }
    .commentary-groups { display: flex; gap: 14px; flex: 1 1 auto; }
    .commentary-group { flex: 1; min-width: 0; }
    .commentary-group-title { font-size: 9px; font-weight: 900; color: var(--ink); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; padding-bottom: 2px; border-bottom: 1px solid var(--line); }
    .commentary-item { display: flex; gap: 5px; align-items: flex-start; margin-bottom: 3px; }
    .commentary-item p { font-size: 10px; font-weight: 600; line-height: 1.35; color: var(--ink); margin: 0; }
    .commentary-item p strong { font-weight: 900; }
    .val-red { color: var(--red) !important; font-weight: 900 !important; }
    .val-green { color: #1b7c3a !important; font-weight: 900 !important; }
    .val-orange { color: var(--orange) !important; font-weight: 900 !important; }

    /* ── Context Bar (monthly context / summary prompt below the title) ─── */
    .context-bar {
      display: block;
      min-height: 64px;
      margin: 0 0 10px;
      padding: 8px 14px 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-left: 3px solid var(--orange);
      border-radius: 0 5px 5px 0;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.45;
      color: var(--muted);
      white-space: pre-wrap;
    }

    /* ── Dense Matrix slide ─── */
    .dm-layout { display: grid; grid-template-columns: 196px minmax(0, 1fr); gap: 12px; align-items: stretch; }
    .dm-rail {
      counter-reset: dm-step;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 10px;
      background: linear-gradient(180deg, #f7fafc 0%, #ffffff 100%);
      border: 1px solid #dfe5ec;
      border-radius: 18px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 8px 18px rgba(30, 41, 59, .06);
    }
    .dm-rail-title {
      padding: 10px 12px;
      background: linear-gradient(135deg, #162f57 0%, #244a86 100%);
      color: #fff;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
      border-radius: 12px;
      box-shadow: inset 4px 0 0 var(--orange);
    }
    .dm-flow-step {
      position: relative;
      margin-top: 8px;
      padding: 10px 12px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--ink);
      background: #fff;
      border: 1px solid #dde5ef;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, .05);
    }
    .dm-flow-step::before {
      counter-increment: dm-step;
      content: "STEP " counter(dm-step, decimal-leading-zero);
      display: block;
      margin-bottom: 4px;
      color: var(--orange);
      font-size: 8px;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .dm-flow-arrow {
      position: relative;
      flex: 1 1 18px;
      min-height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--orange);
      font-size: 12px;
      font-weight: 900;
    }
    .dm-flow-arrow::before {
      content: "";
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 50%;
      width: 1px;
      background: linear-gradient(180deg, rgba(238, 77, 45, 0) 0%, rgba(238, 77, 45, .35) 35%, rgba(238, 77, 45, .35) 65%, rgba(238, 77, 45, 0) 100%);
      transform: translateX(-50%);
    }
    .dm-decision {
      margin-top: 8px;
      padding: 10px 12px;
      background: linear-gradient(180deg, #fff5f2 0%, #fde9e4 100%);
      color: #a13b24;
      font-size: 10px;
      font-weight: 900;
      line-height: 1.35;
      border: 1px solid #f0c1b8;
      border-radius: 14px;
      box-shadow: inset 4px 0 0 #ef6b50;
    }
    .dm-decision-label { font-size: 8px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 4px; opacity: .8; }
    .dm-table-wrap {
      min-height: 0;
      overflow: hidden;
      border: 1px solid #dfe5ec;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 8px 18px rgba(30, 41, 59, .05);
    }
    .dm-table { width: 100%; border-collapse: collapse; font-size: calc(9px * var(--table-scale, 1)); }
    .dm-table th { background: #202325; color: #fff; font-weight: 900; font-size: calc(8.5px * var(--table-scale, 1)); text-align: center; padding: calc(4px * var(--table-scale-y, 1)) calc(2px * var(--table-scale, 1)); white-space: nowrap; }
    .dm-table th.dm-th-market { text-align: left; padding-left: calc(6px * var(--table-scale, 1)); width: 48px; }
    .dm-table th.dm-th-status { width: 62px; }
    .dm-table td { padding: calc(2px * var(--table-scale-y, 1)) calc(3px * var(--table-scale, 1)); text-align: center; border-bottom: 1px solid #eef; font-size: calc(9px * var(--table-scale, 1)); white-space: nowrap; vertical-align: middle; }
    .dm-table td.dm-market-cell { font-weight: 900; font-size: calc(9.5px * var(--table-scale, 1)); text-align: left; padding-left: calc(6px * var(--table-scale, 1)); background: #f9f9f9; border-right: 2px solid var(--line); vertical-align: middle; }
    .dm-table td.dm-sub { font-size: calc(8px * var(--table-scale, 1)); color: var(--muted); font-weight: 600; }
    .dm-table td.dm-val { font-weight: 700; }
    .dm-table td.dm-mom { font-size: calc(8px * var(--table-scale, 1)); color: var(--muted); font-weight: 600; }
    .dm-table td.dm-mom.up { color: #1b7c3a; }
    .dm-table td.dm-mom.dn { color: var(--red); }
    .dm-table .dm-section-hd td { background: #2f3438; color: #fff; font-weight: 900; font-size: 9px; padding: 4px 6px; text-align: left; }
    .dm-table th.dm-highlight { background: #ef6b50 !important; color: #fff !important; box-shadow: inset 2px 0 0 #d94d33, inset -2px 0 0 #d94d33; }
    .dm-table td.dm-highlight { background: #fff0ec !important; box-shadow: inset 2px 0 0 #ef6b50, inset -2px 0 0 #ef6b50; }

    /* ── Multi-table Benchmark ─────────────────────────────────────── */
    .benchmark-grid {
      display: grid;
      grid-template-columns: 66% 34%;
      gap: 14px;
      align-items: stretch;
      min-height: 0;
    }
    .benchmark-tables {
      display: grid;
      grid-template-rows: max-content minmax(0, 1fr);
      gap: 12px;
      min-height: 0;
    }
    .data-shell {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 20px rgba(32, 35, 37, .05);
    }
    .data-shell.fill { min-height: 0; }
    .data-shell-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: #fbfbfc;
      border-bottom: 1px solid var(--line);
    }
    .data-shell-index {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      background: var(--orange);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 900;
      flex-shrink: 0;
    }
    .data-shell-label {
      font-size: 12.5px;
      font-weight: 900;
      letter-spacing: -.01em;
      color: var(--ink);
      line-height: 1.2;
    }
    .data-shell-table {
      min-height: 0;
      overflow: hidden;
      background: #fff;
    }
    .data-shell.fill .data-shell-table {
      flex: 1 1 auto;
      min-height: 0;
    }
    .okr-benchmark-table td,
    .okr-benchmark-table th {
      font-size: calc(10.8px * var(--table-scale, 1));
      padding: calc(4.4px * var(--table-scale-y, 1)) calc(5.6px * var(--table-scale, 1));
    }
    .okr-benchmark-table th.metric-head-blue { background: #1f4478; color: #fff; }
    .okr-benchmark-table th.metric-head-orange { background: #dd633d; color: #fff; }
    .okr-benchmark-table th.metric-head-yellow { background: #dda338; color: #fff; }
    .okr-benchmark-table th.metric-head-black { background: #111; color: #fff; }
    .okr-benchmark-table .delta-row td,
    .okr-benchmark-table .rank-row td {
      background: #f8edd8;
      font-weight: 900;
    }
    .okr-benchmark-table .delta-row td {
      font-size: calc(11.4px * var(--table-scale, 1));
    }
    .okr-benchmark-table .entity-col {
      background: #f6f7f8;
      font-weight: 900;
      text-align: left !important;
      padding-left: calc(8px * var(--table-scale, 1));
    }
    .benchmark-notes {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    .benchmark-note-card,
    .benchmark-rank-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 12px 14px;
      box-shadow: 0 8px 20px rgba(32, 35, 37, .04);
    }
    .benchmark-note-card.primary {
      background: linear-gradient(180deg, #fff4ef 0%, #ffffff 100%);
      border-color: rgba(238, 77, 45, .24);
    }
    .benchmark-note-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .benchmark-note-num {
      width: 22px;
      height: 22px;
      border-radius: 999px;
      background: var(--orange);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 11px;
      font-weight: 900;
      flex-shrink: 0;
    }
    .benchmark-note-title,
    .benchmark-rank-title {
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }
    .benchmark-note-card p {
      margin: 0;
      font-size: 12.7px;
      line-height: 1.45;
      font-weight: 700;
      color: var(--ink);
    }
    .benchmark-note-sub {
      margin: 8px 0 0;
      padding-left: 15px;
    }
    .benchmark-note-sub li {
      margin-bottom: 4px;
      font-size: 11.5px;
      line-height: 1.35;
      font-weight: 600;
      color: #4e5155;
    }
    .benchmark-rank-card {
      display: grid;
      gap: 10px;
      min-height: 0;
    }
    .benchmark-rank-grid {
      display: grid;
      gap: 8px;
    }
    .benchmark-rank-item {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 8px;
      align-items: start;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }
    .benchmark-rank-item:first-child {
      padding-top: 0;
      border-top: none;
    }
    .benchmark-rank-label {
      color: var(--orange);
      font-size: 10.5px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .benchmark-rank-item p {
      margin: 0;
      font-size: 12px;
      line-height: 1.38;
      font-weight: 700;
      color: var(--ink);
    }

    /* ── Phase Breakdown + Improvement Plan ───────────────────────── */
    .ops-plan-layout {
      display: grid;
      grid-template-columns: 69% 31%;
      gap: 14px;
      align-items: stretch;
      min-height: 0;
    }
    .ops-plan-left {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .phase-shell {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 8px 20px rgba(32, 35, 37, .05);
    }
    .phase-shell-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      background: #fbfbfc;
      border-bottom: 1px solid var(--line);
    }
    .phase-shell-title {
      margin: 0;
      font-size: 12.8px;
      font-weight: 900;
      letter-spacing: -.01em;
      color: var(--ink);
    }
    .phase-shell-caption {
      color: var(--muted);
      font-size: 10.5px;
      font-weight: 800;
      white-space: nowrap;
    }
    .phase-shell-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .phase-table-wrap {
      min-height: 0;
      overflow: hidden;
      background: #fff;
    }
    .phase-table td,
    .phase-table th {
      font-size: calc(10.3px * var(--table-scale, 1));
      padding: calc(3.8px * var(--table-scale-y, 1)) calc(5px * var(--table-scale, 1));
    }
    .phase-table .phase-group td {
      background: #727982;
      color: #fff;
      font-weight: 900;
      text-align: left !important;
    }
    .phase-table .sub-phase {
      text-align: left !important;
      padding-left: calc(12px * var(--table-scale, 1));
      font-weight: 700;
    }
    .phase-table .flag-note {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 999px;
      background: var(--orange);
      color: #fff;
      font-size: 10.5px;
      font-weight: 900;
      margin-right: 5px;
      vertical-align: middle;
    }
    .ops-plan-right {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    .plan-summary-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 12px 14px;
      box-shadow: 0 8px 20px rgba(32, 35, 37, .04);
    }
    .plan-summary-card p {
      margin: 7px 0 0;
      font-size: 12.4px;
      line-height: 1.42;
      font-weight: 700;
      color: var(--ink);
    }
    .plan-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
    }
    .plan-card {
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(32, 35, 37, .04);
      min-height: 0;
    }
    .plan-card-head {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
    }
    .plan-letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--orange);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 900;
    }
    .plan-title {
      font-size: 12.5px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.25;
    }
    .plan-target-chip {
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 900;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .plan-target-chip.good {
      background: #e9f6ed;
      color: #2f7d39;
      border-color: #cbe4d0;
    }
    .plan-target-chip.warn {
      background: #fff3dd;
      color: #946300;
      border-color: #f0d28f;
    }
    .plan-card p {
      margin: 0;
      font-size: 12.4px;
      line-height: 1.45;
      font-weight: 700;
      color: var(--ink);
    }
    .plan-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .plan-meta-chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 999px;
      background: #f5f6f8;
      color: #4f5358;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.2;
    }
    .zoom-trigger {
      padding: 2px 8px;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      font-size: 10px;
      font-weight: 900;
      cursor: pointer;
      line-height: 1.4;
      font-family: inherit;
      transition: border-color .12s, color .12s, background .12s;
    }
    .zoom-trigger:hover {
      border-color: var(--orange);
      color: var(--orange);
      background: var(--orange-soft);
    }
    .dm-table td.dm-status-cell { vertical-align: middle; padding: 2px 4px; }
    .dm-chip { display: inline-block; padding: 2px 5px; border-radius: 99px; font-size: 8px; font-weight: 900; white-space: nowrap; }
    .dm-chip.good { background: #c6efce; color: #1b5e20; }
    .dm-chip.watch { background: #ffd966; color: #5a3a00; }
    .dm-chip.bad { background: #f4c7c3; color: #7d1a12; }
  </style>
</head>

  <main class="deck" data-deck-stage data-template="shopee-internal-report" data-storage-version="internal-v10">

    <!-- Modal overlay -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" tabindex="-1" hidden>
      <div class="modal-box">
        <button class="modal-close" type="button" aria-label="Close">×</button>
        <div class="modal-body"></div>
      </div>
    </div>

  </main>
  <script src="./deck-stage.js"></script>
  <script>
    // Accordion
    document.querySelectorAll('.acc-trigger').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        if (e.target.isContentEditable) return;
        btn.closest('.acc-item').classList.toggle('open');
      });
    });

    // Tabs
    document.querySelectorAll('.tab-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var group = btn.closest('.tab-group');
        group.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        group.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
        btn.classList.add('active');
        var panel = document.getElementById(btn.dataset.tab);
        if (panel) panel.classList.add('active');
      });
    });

    // Modal
    var _overlay = document.getElementById('modal-overlay');
    var _modalBody = _overlay && _overlay.querySelector('.modal-body');
    var _modalBox = _overlay && _overlay.querySelector('.modal-box');

    document.querySelectorAll('.modal-trigger').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (!_modalBody || !_overlay) return;
        if (_modalBox) _modalBox.classList.toggle('wide', btn.dataset.modalWide === 'true');

        if (btn.dataset.zoomTableTarget) {
          var slide = btn.closest('.slide');
          var table = slide && slide.querySelector(btn.dataset.zoomTableTarget);
          var title = btn.dataset.modalTitle || '放大查看';
          if (table) {
            _modalBody.innerHTML = '<strong>' + title + '</strong><div class="zoom-table-wrap">' + table.outerHTML + '</div>';
          }
        } else {
          var src = document.getElementById(btn.dataset.target);
          if (src) _modalBody.innerHTML = src.innerHTML;
        }
        if (_overlay) _overlay.removeAttribute('hidden');
      });
    });

    if (_overlay) {
      _overlay.addEventListener('click', function(e) {
        if (e.target === _overlay || e.target.classList.contains('modal-close')) {
          if (_modalBox) _modalBox.classList.remove('wide');
          _overlay.setAttribute('hidden', '');
        }
      });
    }
  </script>
</body>
</html>
